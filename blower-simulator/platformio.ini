; PlatformIO Project Configuration - Blower Simulator
;
; Test controller for Smart Sail Switch validation

[platformio]
default_envs = attiny85

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino

; Clock configuration
board_build.f_cpu = 8000000L

; Fuse settings for 8MHz internal oscillator
board_fuses.lfuse = 0x62
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

; Upload protocol - USBtinyISP
upload_protocol = usbtiny
upload_flags =
    -B 5

; Build flags
build_flags =
    -DARDUINO_AVR_ATTINY85
    -DF_CPU=8000000L
    -Os

[env:wokwi]
platform = atmelavr
board = attiny85
framework = arduino
board_build.f_cpu = 8000000L

; Wokwi simulation
platform_packages =
    toolchain-atmelavr@^1.70300.0
