name: Build and Release Firmware

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - name: smart-sail-switch
            path: .
            env: attiny85
          - name: blower-simulator
            path: blower-simulator
            env: attiny85

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.project.name }}
        working-directory: ${{ matrix.project.path }}
        run: |
          pio run -e ${{ matrix.project.env }}

      - name: Get build info
        id: build_info
        working-directory: ${{ matrix.project.path }}
        run: |
          echo "hex_size=$(stat -c%s .pio/build/${{ matrix.project.env }}/firmware.hex)" >> $GITHUB_OUTPUT
          echo "elf_size=$(stat -c%s .pio/build/${{ matrix.project.env }}/firmware.elf)" >> $GITHUB_OUTPUT

      - name: Upload hex artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-firmware
          path: ${{ matrix.project.path }}/.pio/build/${{ matrix.project.env }}/firmware.hex
          retention-days: 30

      - name: Upload elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-elf
          path: ${{ matrix.project.path }}/.pio/build/${{ matrix.project.env }}/firmware.elf
          retention-days: 30

      - name: Build summary
        run: |
          echo "### Build Summary - ${{ matrix.project.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Hex size: ${{ steps.build_info.outputs.hex_size }} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- ELF size: ${{ steps.build_info.outputs.elf_size }} bytes" >> $GITHUB_STEP_SUMMARY

  simulate:
    name: Wokwi Simulation Test
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - name: smart-sail-switch
            path: .
          - name: blower-simulator
            path: blower-simulator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware for Wokwi
        working-directory: ${{ matrix.project.path }}
        run: |
          pio run -e wokwi

      - name: Install Wokwi CLI
        run: |
          curl -L https://wokwi.com/ci/install.sh | sh

      - name: Run Wokwi Simulation Test
        working-directory: ${{ matrix.project.path }}
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          # Run simulation with test scenario
          # Exit code 0 = all tests passed
          # Any other exit code = test failure
          ~/.wokwi/bin/wokwi-cli . --scenario test-scenario.yaml
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✓ All simulation tests passed"
            exit 0
          else
            echo "✗ Simulation tests failed with exit code $EXIT_CODE"
            exit 1
          fi
        timeout-minutes: 2

      - name: Simulation summary
        run: |
          echo "### Simulation Test - ${{ matrix.project.name }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Wokwi simulation completed successfully" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: [build, simulate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release files
        run: |
          mkdir -p release
          cp smart-sail-switch-firmware/firmware.hex release/smart-sail-switch-${{ github.ref_name }}.hex
          cp blower-simulator-firmware/firmware.hex release/blower-simulator-${{ github.ref_name }}.hex
          cp smart-sail-switch-elf/firmware.elf release/smart-sail-switch-${{ github.ref_name }}.elf
          cp blower-simulator-elf/firmware.elf release/blower-simulator-${{ github.ref_name }}.elf

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum *.hex *.elf > checksums.txt

      - name: Extract release notes
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract notes for this version from CHANGELOG
            awk '/^## \[${{ github.ref_name }}\]/{flag=1;next}/^## /{flag=0}flag' CHANGELOG.md > release_notes.txt
          else
            echo "Automated release build" > release_notes.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.hex
            release/*.elf
            release/checksums.txt
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "### Release Created - ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Released firmware files:" >> $GITHUB_STEP_SUMMARY
          echo "- smart-sail-switch-${{ github.ref_name }}.hex" >> $GITHUB_STEP_SUMMARY
          echo "- blower-simulator-${{ github.ref_name }}.hex" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checksums:" >> $GITHUB_STEP_SUMMARY
          cat release/checksums.txt >> $GITHUB_STEP_SUMMARY
