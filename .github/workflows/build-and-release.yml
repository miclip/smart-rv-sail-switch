name: Build and Release Firmware

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - name: smart-sail-switch
            path: .
            env: attiny85
          - name: blower-simulator
            path: blower-simulator
            env: attiny85

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.project.name }}
        working-directory: ${{ matrix.project.path }}
        run: |
          pio run -e ${{ matrix.project.env }}

      - name: Get build info
        id: build_info
        working-directory: ${{ matrix.project.path }}
        run: |
          echo "hex_size=$(stat -c%s .pio/build/${{ matrix.project.env }}/firmware.hex)" >> $GITHUB_OUTPUT
          echo "elf_size=$(stat -c%s .pio/build/${{ matrix.project.env }}/firmware.elf)" >> $GITHUB_OUTPUT

      - name: Upload hex artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.project.name }}-firmware
          path: ${{ matrix.project.path }}/.pio/build/${{ matrix.project.env }}/firmware.hex
          retention-days: 30

      - name: Upload elf artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.project.name }}-elf
          path: ${{ matrix.project.path }}/.pio/build/${{ matrix.project.env }}/firmware.elf
          retention-days: 30

      - name: Build summary
        run: |
          echo "### Build Summary - ${{ matrix.project.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Hex size: ${{ steps.build_info.outputs.hex_size }} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- ELF size: ${{ steps.build_info.outputs.elf_size }} bytes" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Prepare release files
        run: |
          mkdir -p release
          cp smart-sail-switch-firmware/firmware.hex release/smart-sail-switch-${{ github.ref_name }}.hex
          cp blower-simulator-firmware/firmware.hex release/blower-simulator-${{ github.ref_name }}.hex
          cp smart-sail-switch-elf/firmware.elf release/smart-sail-switch-${{ github.ref_name }}.elf
          cp blower-simulator-elf/firmware.elf release/blower-simulator-${{ github.ref_name }}.elf

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum *.hex *.elf > checksums.txt

      - name: Extract release notes
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract notes for this version from CHANGELOG
            awk '/^## \[${{ github.ref_name }}\]/{flag=1;next}/^## /{flag=0}flag' CHANGELOG.md > release_notes.txt
          else
            echo "Automated release build" > release_notes.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.hex
            release/*.elf
            release/checksums.txt
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "### Release Created - ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Released firmware files:" >> $GITHUB_STEP_SUMMARY
          echo "- smart-sail-switch-${{ github.ref_name }}.hex" >> $GITHUB_STEP_SUMMARY
          echo "- blower-simulator-${{ github.ref_name }}.hex" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checksums:" >> $GITHUB_STEP_SUMMARY
          cat release/checksums.txt >> $GITHUB_STEP_SUMMARY
