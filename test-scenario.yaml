name: Smart Sail Switch Tests
version: 1
author: miclip
steps:
  # Test 1: Wait for startup sequence to complete
  - delay: 2000ms

  # Test 2: Turn on blower
  - set-control:
      part-id: sw_blower
      control: value
      value: 1

  - delay: 500ms

  # Test 3: Turn off blower
  - set-control:
      part-id: sw_blower
      control: value
      value: 0

  - delay: 500ms

  # Test completed - firmware ran without crashing
