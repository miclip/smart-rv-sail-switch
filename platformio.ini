; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = attiny85

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino

; Clock configuration
board_build.f_cpu = 8000000L

; Fuse settings for 8MHz internal oscillator
board_fuses.lfuse = 0x62
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

; Upload protocol - USBtinyISP
upload_protocol = usbtiny
upload_flags =
    -B 5

; Build flags
build_unflags =
    -flto
    -fuse-linker-plugin

build_flags =
    -DARDUINO_AVR_ATTINY85
    -DF_CPU=8000000L
    -O1

; Monitor (if using software serial debugging)
; monitor_speed = 9600

; Library dependencies
lib_deps =
    # Add any required libraries here

[env:wokwi]
platform = atmelavr
board = attiny85
framework = arduino
board_build.f_cpu = 8000000L

; Wokwi simulation - disable EEPROM (causes hangs in simulation)
build_flags =
    -DWOKWI_SIM

platform_packages =
    toolchain-atmelavr@^1.70300.0
